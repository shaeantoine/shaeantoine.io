<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catch the Dot</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #ccc;
            height: 100vh;
            overflow: hidden;
            cursor: none;
        }

        .layout {
            display: flex;
            height: 100vh;
        }

        /* Game area */
        .game-panel {
            flex: 1;
            position: relative;
            min-width: 0;
        }
        #game-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Viz sidebar */
        .viz-panel {
            width: 300px;
            border-left: 1px solid #1a1a1a;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            background: #080808;
        }
        .viz-section {
            padding: 0.6rem 0.75rem;
            border-bottom: 1px solid #111;
            flex-shrink: 0;
        }
        .viz-section h3 {
            font-size: 0.65rem;
            color: #444;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.4rem;
        }
        .viz-section canvas {
            width: 100%;
            display: block;
            border-radius: 2px;
        }
        #graph-container {
            width: 100%;
            height: 160px;
        }
        #weights-canvas { height: 70px; }
        #loss-canvas { height: 90px; }
        #activations-canvas { height: 70px; }
        #stats-canvas { height: 85px; }

        .viz-section.flash {
            background: rgba(68, 170, 255, 0.03);
            transition: background 0.1s;
        }

        /* Header bar */
        .header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 0.5rem 1rem;
            display: flex;
            align-items: center;
            gap: 1.5rem;
            pointer-events: none;
            z-index: 10;
        }
        .header h1 {
            font-size: 0.85rem;
            color: #fff;
            letter-spacing: 0.15em;
            pointer-events: auto;
        }
        .header .status {
            font-size: 0.7rem;
            color: #555;
        }
        .header .controls {
            margin-left: auto;
            display: flex;
            gap: 0.75rem;
            pointer-events: auto;
        }
        .header button {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #888;
            font-family: inherit;
            font-size: 0.7rem;
            padding: 0.25rem 0.6rem;
            cursor: pointer;
            border-radius: 2px;
        }
        .header button:hover {
            color: #ccc;
            border-color: #555;
        }

        /* Difficulty indicator */
        .difficulty-bar {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            pointer-events: none;
            z-index: 10;
        }
        .difficulty-bar span {
            font-size: 0.65rem;
            color: #333;
        }
        .difficulty-meter {
            width: 120px;
            height: 3px;
            background: #1a1a1a;
            border-radius: 2px;
            overflow: hidden;
        }
        .difficulty-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #4af, #f84);
            transition: width 0.5s ease;
        }

        /* Mobile: stack vertically, show game on top */
        @media (max-width: 800px) {
            .layout { flex-direction: column; }
            .viz-panel {
                width: 100%;
                max-height: 35vh;
                border-left: none;
                border-top: 1px solid #1a1a1a;
                flex-direction: row;
                flex-wrap: wrap;
                overflow-x: auto;
            }
            .viz-section {
                min-width: 200px;
                flex: 1;
            }
            #graph-container { height: 120px; }
            body { cursor: auto; }
        }
    </style>
</head>
<body>
    <div class="layout">
        <div class="game-panel">
            <canvas id="game-canvas"></canvas>

            <div class="header">
                <h1>CATCH THE DOT</h1>
                <div class="status" id="status">loading brain...</div>
                <div class="controls">
                    <button id="reset-btn">new brain</button>
                </div>
            </div>

            <div class="difficulty-bar">
                <span>difficulty</span>
                <div class="difficulty-meter">
                    <div class="difficulty-fill" id="difficulty-fill"></div>
                </div>
            </div>
        </div>

        <div class="viz-panel">
            <div class="viz-section" id="graph-section">
                <h3>Network</h3>
                <div id="graph-container"></div>
            </div>
            <div class="viz-section" id="stats-section">
                <h3>Stats</h3>
                <canvas id="stats-canvas"></canvas>
            </div>
            <div class="viz-section" id="loss-section">
                <h3>Loss</h3>
                <canvas id="loss-canvas"></canvas>
            </div>
            <div class="viz-section" id="weights-section">
                <h3>Weights</h3>
                <canvas id="weights-canvas"></canvas>
            </div>
            <div class="viz-section" id="activations-section">
                <h3>Activations</h3>
                <canvas id="activations-canvas"></canvas>
            </div>
        </div>
    </div>

    <script type="module">
        import { Game } from './js/game.js';
        import { Brain } from './js/brain.js';
        import { Viz } from './js/viz.js';
        import { Persistence } from './js/persistence.js';

        const canvas = document.getElementById('game-canvas');
        const statusEl = document.getElementById('status');
        const difficultyFill = document.getElementById('difficulty-fill');
        const game = new Game(canvas);
        const brain = new Brain();
        const persistence = new Persistence();
        let viz = null;

        let catchCount = 0;
        let reinforceCounter = 0;
        let vizFrameCounter = 0;
        let loadedFromSave = false;

        async function init() {
            try {
                await persistence.init();
                await brain.init();

                // Try to restore saved weights
                const saved = await persistence.loadWeights();
                if (saved && saved.weights) {
                    try {
                        brain.loadWeights(saved.weights);
                        catchCount = saved.catches || 0;
                        game.score = catchCount;
                        game.bestStreak = saved.bestStreak || 0;
                        loadedFromSave = true;
                        statusEl.textContent = `resumed · ${catchCount} catches · step ${saved.trainSteps || 0}`;
                    } catch (e) {
                        console.warn('Failed to load saved weights:', e);
                    }
                }

                if (!loadedFromSave) {
                    statusEl.textContent = `mlp loaded · ${brain.totalParams} params`;
                }

                // Restore stats
                const stats = persistence.loadStats();
                if (stats) {
                    game.bestStreak = Math.max(game.bestStreak, stats.bestStreak || 0);
                }

                // Initialize visualization
                viz = new Viz(brain, {
                    graph: document.getElementById('graph-container'),
                    weights: document.getElementById('weights-canvas'),
                    loss: document.getElementById('loss-canvas'),
                    activations: document.getElementById('activations-canvas'),
                    stats: document.getElementById('stats-canvas'),
                });
                viz.initGraph();
                viz.redrawAll(game);

                // Wire brain to game
                game.moveFn = (obs) => brain.forward(obs);

                // On catch: train + save + update viz
                game.onCatch = ({ score, obs, framesSurvived }) => {
                    catchCount = score;

                    const result = brain.trainWithReplay(obs, 0.02, 8);
                    const loss = result.losses[result.losses.length - 1];

                    statusEl.textContent = `catch #${score} · loss: ${loss.toFixed(4)} · step ${brain.getTrainingStep()}`;

                    // Difficulty meter
                    const avgSurvival = score > 0 ? game.totalFramesSurvived / score : 0;
                    const difficulty = Math.min(100, avgSurvival / 5);
                    difficultyFill.style.width = `${difficulty}%`;

                    // Dot color shifts as it learns (blue → purple → red)
                    const t = Math.min(1, score / 40);
                    const r = Math.round(68 + t * 180);
                    const g = Math.round(170 - t * 100);
                    const b = Math.round(255 - t * 150);
                    game.dotColor = `rgb(${r},${g},${b})`;

                    // Viz update
                    if (viz) {
                        viz.onCatch(loss, framesSurvived);
                        viz.drawStats(game);
                        flashPanels();
                    }

                    // Save weights after each catch
                    saveState();
                };

                // On frame: reinforce + update viz
                game.onFrame = (obs) => {
                    reinforceCounter++;
                    vizFrameCounter++;

                    // Reinforce when close but surviving — only if output is not saturated
                    if (obs.distance < 100 && reinforceCounter % 30 === 0) {
                        const output = brain.forward(obs);
                        const mag = Math.hypot(output[0], output[1]);
                        if (mag < 0.95) {
                            brain.reinforce(obs, 0.005, 1);
                        }
                    }

                    if (viz && vizFrameCounter % 4 === 0) {
                        viz.onFrame(game);
                    }

                    if (viz && vizFrameCounter % 30 === 0) {
                        viz.drawStats(game);
                    }
                };

                game.start();
            } catch (e) {
                statusEl.textContent = `error: ${e.message}`;
                console.error(e);
                game.start();
            }
        }

        async function saveState() {
            const weights = brain.exportWeights();
            if (weights) {
                await persistence.saveWeights(weights, {
                    catches: catchCount,
                    trainSteps: brain.getTrainingStep(),
                    bestStreak: game.bestStreak
                });
            }
            persistence.saveStats({
                catches: catchCount,
                bestStreak: game.bestStreak,
                trainSteps: brain.getTrainingStep()
            });
        }

        function flashPanels() {
            const sections = document.querySelectorAll('.viz-section');
            sections.forEach(s => {
                s.classList.add('flash');
                setTimeout(() => s.classList.remove('flash'), 300);
            });
        }

        document.getElementById('reset-btn').addEventListener('click', async () => {
            if (!confirm('Reset brain? The dot will forget everything it learned.')) return;
            await persistence.clearAll();
            await brain.init();
            game.reset();
            game.dotColor = '#4af';
            catchCount = 0;
            reinforceCounter = 0;
            vizFrameCounter = 0;
            difficultyFill.style.width = '0%';
            statusEl.textContent = 'brain reset · new weights';
            if (viz) {
                viz.lossHistory = [];
                viz.survivalHistory = [];
                viz.redrawAll(game);
            }
        });

        window.addEventListener('resize', () => {
            if (viz) viz.redrawAll(game);
        });

        window.addEventListener('beforeunload', () => {
            saveState();
        });

        init();
    </script>
</body>
</html>
