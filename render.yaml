services:
  - type: web
    name: catch-the-dot
    env: static
    buildCommand: echo "No build required"
    staticPublishPath: ./
    headers:
      - path: /model.wasm
        name: Content-Type
        value: application/wasm
      - path: /model.wasm
        name: Cache-Control
        value: public, max-age=604800
