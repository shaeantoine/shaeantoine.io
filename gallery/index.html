<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shae McKenna's Collection</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;550;600&display=swap">
    <link rel="stylesheet" href="./src/style.css">
</head>
<body>
    <header id="site-header" class="site-header" hidden>
        <div class="site-header-inner">
            <span class="site-header-name">Shae McKenna</span>
            <nav class="site-header-nav">
                <a class="nav-link nav-link-active" href="#/">Collection</a>
            </nav>
        </div>
    </header>

    <div id="grid" class="grid" hidden></div>

    <img id="tile-clone" class="tile-clone" hidden alt="" />

    <canvas id="artwork-canvas" hidden></canvas>

    <div id="fragment" class="fragment" hidden></div>

    <button id="close-work" class="close-work" type="button" hidden>&times;</button>

    <button id="enter-piece" class="enter-piece" type="button" hidden>Read the piece &rarr;</button>

    <article id="piece" class="piece" hidden></article>

    <script type="module" src="./src/main.js"></script>
</body>
</html>
