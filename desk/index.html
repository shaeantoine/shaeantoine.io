<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shae McKenna's Desk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Inter is the site's face; Newsreader re-typesets press; Charis SIL
         (Charter's outlines) sets the monitor's home page and its map. Shae's own
         handwriting (Shae Hand) is self-hosted and declared in src/style.css.
         Canvas text waits for these explicitly — see src/core/fonts.js. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&display=swap">
    <!-- Its own link, so a hiccup with this family can never take Inter or Newsreader down with it. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Charis+SIL:ital,wght@0,400;0,700;1,400&display=swap">
    <link rel="stylesheet" href="./src/style.css">
</head>
<body>
    <header id="site-header" class="site-header desk-header" hidden>
        <div class="site-header-inner">
            <div class="desk-header-id">
                <span class="site-header-name">Shae McKenna</span>
                <!-- Shown whenever a part of the room is open: the same step back as Esc. -->
                <button id="desk-back" class="desk-back" type="button" hidden><span aria-hidden="true">←</span> back</button>
            </div>
            <nav class="site-header-nav" aria-label="Site">
                <a id="desk-leave" class="nav-link desk-leave" href="#printer">Before you go <span aria-hidden="true">→</span></a>
            </nav>
        </div>
    </header>

    <canvas id="desk-canvas" class="desk-canvas" hidden aria-label="Shae McKenna's desk, in 3D"></canvas>

    <div id="desk-object-label" class="desk-object-label" hidden></div>

    <div id="webgl-fallback" class="webgl-fallback" hidden>
        <p>This experience needs a browser with WebGL support.</p>
    </div>

    <div id="focus-vignette" class="focus-vignette" hidden></div>

    <!-- Modules' DOM controls live here (pointer events on children only). -->
    <div id="desk-overlay" class="desk-overlay">
        <div id="desk-actions" class="desk-actions"></div>
    </div>

    <p id="desk-hint" class="desk-hint is-empty" aria-hidden="true"></p>
    <div id="desk-live" class="desk-sr-only" aria-live="polite" aria-atomic="true"></div>

    <div id="loading-veil" class="loading-veil">
        <div class="loading-veil-inner">
            <span class="loading-veil-name">Shae McKenna</span>
            <div class="loading-veil-track" role="progressbar" aria-label="Loading the desk" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <div id="loading-veil-bar" class="loading-veil-bar"></div>
            </div>
        </div>
    </div>

    <script type="module" src="./src/main.js"></script>
</body>
</html>
